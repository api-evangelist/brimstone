name: Brimstone
description: Brimstone is a materials technology company decarbonizing heavy industry through
  a single-rock co-production process it calls the Rock Refinery. From ordinary calcium silicate
  rock it extracts multiple high-value materials at once - carbon-negative Portland cement and
  supplementary cementitious materials, alumina and aluminum, magnesium, titanium, iron/steel
  feedstock and critical minerals - aiming to use 100% of the feed rock and eliminate tailings
  while cutting process emissions. The company uses commercially available equipment for a
  low-cost, market-ready approach, and has secured commitments including Amazon as a buyer of
  low-carbon cement from its first commercial plant. Brimstone is a private heavy-industry /
  climate-tech company backed by DCVC and Fifth Wall; it operates no public developer API.
